services:
  broker:
    cpuset: "${BROKER_CPUSET:-4-5}"

  jobmanager:
    image: flink:2.2.1-java17
    container_name: jobmanager
    command: jobmanager
    cpuset: "${BROKER_CPUSET:-4-5}"
    ports:
      - "8081:8081"
    volumes:
      - ./flink-job/target:/opt/job:ro
      - ./config:/opt/config:ro
      - ./checkpoints:/opt/checkpoints
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        parallelism.default: ${TM_SLOTS:-4}
        metrics.fetcher.update-interval: 1 s

  taskmanager:
    image: flink:2.2.1-java17
    container_name: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    cpuset: "${TM_CPUSET:-0-3}"
    ports:
      - "9249:9249"
    volumes:
      - ./config:/opt/config:ro
      - ./checkpoints:/opt/checkpoints
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: ${TM_SLOTS:-4}
        taskmanager.memory.process.size: 4096m
        parallelism.default: ${TM_SLOTS:-4}
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
